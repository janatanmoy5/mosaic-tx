<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
<title id="title">MOSAIC-Tx evidence-gated single-cell to therapeutics workflow</title>
<desc id="desc">Human NovaSeq single-cell object, patient-level cell states, bulk replication, grouped machine learning, drug reversal and conditional target-specific QSAR.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#596a72"/></marker></defs>
<rect width="1800" height="1050" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="70" y="65" font-size="38" font-weight="700" fill="#122831">MOSAIC-Tx · from human cell states to testable intervention hypotheses</text>
<text x="70" y="105" font-size="20" fill="#53666e">A gated workflow: each arrow requires independent evidence; failure stops downstream claims</text>

<g stroke-width="2">
<rect x="60" y="165" width="250" height="510" rx="12" fill="#eaf5f3" stroke="#5e9f94"/>
<rect x="340" y="165" width="250" height="510" rx="12" fill="#edf3f9" stroke="#658fb0"/>
<rect x="620" y="165" width="250" height="510" rx="12" fill="#f4f1e9" stroke="#a7864f"/>
<rect x="900" y="165" width="250" height="510" rx="12" fill="#f6edf2" stroke="#aa748f"/>
<rect x="1180" y="165" width="250" height="510" rx="12" fill="#f3eef8" stroke="#8c72ad"/>
<rect x="1460" y="165" width="280" height="510" rx="12" fill="#f2f4f4" stroke="#7a8a91"/>
</g>

<g font-size="23" font-weight="700" fill="#17313a">
<text x="85" y="215">1 · Eligible cells</text><text x="365" y="215">2 · Cell states</text>
<text x="645" y="215">3 · Bulk bridge</text><text x="925" y="215">4 · Biomarker</text>
<text x="1205" y="215">5 · Drug reversal</text><text x="1485" y="215">6 · Conditional QSAR</text>
</g>

<g font-size="18" fill="#263b44">
<text x="85" y="265" font-weight="700">Human NovaSeq 6000</text><text x="85" y="300">E-MTAB-12051 biopsy</text><text x="85" y="332">GSE216203 blood NK</text><text x="85" y="382">Scanpy AnnData</text><text x="85" y="414">raw counts preserved</text><text x="85" y="446">optional MuData export</text><text x="85" y="500" font-weight="700">Controls kept separate</text><text x="85" y="532">stable allograft</text><text x="85" y="564">non-rejection injury</text><text x="85" y="596">native healthy reference</text>

<text x="365" y="265">QC · HVG · PCA</text><text x="365" y="297">neighbors · UMAP</text><text x="365" y="329">Leiden clusters</text><text x="365" y="379" font-weight="700">Reviewed annotation</text><text x="365" y="411">FCGR3A+ NK</text><text x="365" y="443">FCGR3A+ monocytes</text><text x="365" y="475">CD8 T cells</text><text x="365" y="507">glomerular / PTC EC</text><text x="365" y="557" font-weight="700">Patient pseudobulk</text><text x="365" y="589">GSEA / Reactome / GO</text>

<text x="645" y="265" font-weight="700">Do not concatenate</text><text x="645" y="297">cells with bulk samples</text><text x="645" y="347">Transfer modules and</text><text x="645" y="379">effect directions into</text><text x="645" y="411">GSE50084</text><text x="645" y="443">GSE36059</text><text x="645" y="475">GSE275824</text><text x="645" y="525" font-weight="700">Require</text><text x="645" y="557">ABMR replication</text><text x="645" y="589">TCMR specificity</text><text x="645" y="621">treatment trajectory</text>

<text x="925" y="265" font-weight="700">Frozen features only</text><text x="925" y="297">genes · pathways</text><text x="925" y="329">cell proportions</text><text x="925" y="379">Elastic-net primary</text><text x="925" y="411">patient-grouped nested CV</text><text x="925" y="443">leave-study-out test</text><text x="925" y="493" font-weight="700">Report</text><text x="925" y="525">AUROC · AUPRC</text><text x="925" y="557">calibration · Brier</text><text x="925" y="589">feature stability</text>

<text x="1205" y="265">Replicated up/down</text><text x="1205" y="297">cell-state signatures</text><text x="1205" y="347">LINCS/CMap matching</text><text x="1205" y="379">context consistency</text><text x="1205" y="411">target direction</text><text x="1205" y="443">renal/transplant safety</text><text x="1205" y="493" font-weight="700">Output</text><text x="1205" y="525">approved and</text><text x="1205" y="557">investigational drugs</text><text x="1205" y="589">kept distinct</text>

<text x="1485" y="265" font-weight="700">Only after target gate</text><text x="1485" y="297">one human target</text><text x="1485" y="329">known action direction</text><text x="1485" y="361">adequate ChEMBL series</text><text x="1485" y="411">standardize chemistry</text><text x="1485" y="443">scaffold-held-out test</text><text x="1485" y="475">applicability domain</text><text x="1485" y="507">Y-randomization</text><text x="1485" y="557">Docking / MD explain</text><text x="1485" y="589">selected leads only</text>
</g>

<g stroke="#596a72" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M310 420H333"/><path d="M590 420H613"/><path d="M870 420H893"/><path d="M1150 420H1173"/><path d="M1430 420H1453"/></g>

<rect x="60" y="730" width="1680" height="235" rx="12" fill="#f7f9fa" stroke="#cbd5d9" stroke-width="2"/>
<text x="90" y="780" font-size="22" font-weight="700" fill="#20363f">Stop/go gates</text>
<g font-size="18" fill="#3b5058"><text x="90" y="825">Cells → signature: donor-level pseudobulk replication</text><text x="620" y="825">Signature → biomarker: independent cohort + specificity</text><text x="1190" y="825">Signature → drug: robust reversal + correct pharmacology</text><text x="90" y="865">Biomarker → model: grouped validation + calibration</text><text x="620" y="865">Target → QSAR: comparable activities + scaffold split</text><text x="1190" y="865">QSAR → lead: applicability domain + external test</text></g>
<line x1="90" y1="900" x2="1710" y2="900" stroke="#d5dcdf"/>
<text x="900" y="938" text-anchor="middle" font-size="19" font-weight="700" fill="#8b3d42">Computational prioritization is not clinical validation, drug efficacy, or evidence for patient treatment.</text>
</g></svg>
