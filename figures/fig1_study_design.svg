<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">MOSAIC-Tx evidence-backed study design</title><desc id="d">Public bulk discovery, independent specificity, randomized longitudinal response, patient-level single-cell localization and cautious synthesis.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#50636b"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="65" y="58" font-size="34" font-weight="700" fill="#13272f">MOSAIC-Tx: evidence chain for immune activity versus persistent tissue injury</text><text x="65" y="94" font-size="18" fill="#50636b">One falsifiable biological model • public de-identified data • patient/sample-level inference</text>
