<g><rect x="55" y="700" width="1490" height="120" rx="8" fill="#f7f9fa" stroke="#d1dadd"/><text x="800" y="737" text-anchor="middle" font-size="19" font-weight="700" fill="#263a42">Stop/go rule</text><text x="800" y="771" text-anchor="middle" font-size="16" fill="#50636b">Advance only when a program replicates across cohorts, differs from TCMR, has a coherent treatment trajectory, and localizes at patient level.</text><text x="800" y="800" text-anchor="middle" font-size="15" fill="#8a3f43">Spatial analysis is exploratory; docking and MD are excluded until a target independently passes biological and structural eligibility.</text></g></g></svg>