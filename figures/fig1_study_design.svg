<text x="70" y="62" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#12252d">MOSAIC-Tx: multimodal computational dissection of kidney-allograft injury</text>
<text x="70" y="98" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b">Public, de-identified cohorts • ABMR-centred discovery • TCMR specificity controls • no clinical or wet-lab validation claimed</text>
