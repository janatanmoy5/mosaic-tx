<title id="t">MOSAIC-Tx DSA to graft-injury mechanism</title><desc id="d">Six-node evidence chain from donor-specific antibody through endothelial engagement, FCGR3A-positive innate activation, cytotoxic interferon response and microvascular injury to longitudinal graft response.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#53666d"/></marker></defs>
<rect width="1800" height="900" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif">
<text x="70" y="65" font-size="38" font-weight="700" fill="#132a33">MOSAIC-Tx mechanistic backbone</text><text x="70" y="104" font-size="20" fill="#52666e">Each arrow is tested independently and reported as supported, unsupported, or not testable</text>
<g stroke-width="2">
<rect x="55" y="190" width="250" height="355" rx="14" fill="#f7ebed" stroke="#b96e7a"/><rect x="345" y="190" width="250" height="355" rx="14" fill="#f8f1e5" stroke="#b38d53"/><rect x="635" y="190" width="250" height="355" rx="14" fill="#eaf4f2" stroke="#57988e"/><rect x="925" y="190" width="250" height="355" rx="14" fill="#edf3f8" stroke="#668fae"/><rect x="1215" y="190" width="250" height="355" rx="14" fill="#f0eef7" stroke="#8975ab"/><rect x="1505" y="190" width="250" height="355" rx="14" fill="#f1f3f3" stroke="#7c8c92"/>
</g>
