<g font-size="18" fill="#2d4149"><text x="80" y="285">Donor-specific</text><text x="80" y="316">anti-HLA antibody</text><text x="80" y="367" font-weight="700">Measured by</text><text x="80" y="398">DSA metadata</text><text x="80" y="429">GSE50084 states</text><text x="80" y="480">Not inferred from RNA</text>
