<rect x="55" y="620" width="1700" height="190" rx="12" fill="#f7f9fa" stroke="#cbd5d9" stroke-width="2"/><text x="85" y="668" font-size="22" font-weight="700" fill="#213740">Falsification framework</text><text x="85" y="710" font-size="18" fill="#3f535b">DSA is not assumed sufficient • cell lineage is not inferred from one marker • association is not called causation • TCMR and CMV/BK are specificity controls</text><text x="85" y="750" font-size="18" fill="#3f535b">Persistence requires confidence intervals or equivalence testing—not one nonsignificant P value • every downstream biomarker or drug candidate must traverse all evidence gates</text><text x="900" y="790" text-anchor="middle" font-size="18" font-weight="700" fill="#8a3d43">Primary output: an evidence state for every arrow, not a predetermined mechanistic claim</text>
</g></svg>
