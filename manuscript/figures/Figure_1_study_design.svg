<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="600" viewBox="0 0 1250 600">
<rect width="1250" height="600" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#18313b}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#4c626c}.head{font-size:20px;font-weight:700}.body{font-size:16px}.gate{font-size:15px;font-weight:700;fill:#8f3c3c}</style>
<text x="45" y="55" class="title">MOSAIC-Tx: prespecified cohorts, estimands, and decision gates</text>
<text x="45" y="85" class="sub">All labels are public-metadata-derived; cross-platform expression is never pooled</text>
<rect x="45" y="135" rx="12" width="345" height="285" fill="#eaf5f3" stroke="#4d9c94" stroke-width="2"/>
<text x="70" y="180" class="head">1. DSA-state discovery</text>
<text x="70" y="225" class="body">GSE50084 | 61 biopsies</text>
<text x="70" y="270" class="body">DSA- NR | DSA+ NR | DSA+ rejection</text>
<text x="70" y="330" class="body">Estimand: rejection among DSA+ grafts</text>
<text x="70" y="375" class="sub">Model: moderated effect + 95% CI + BH FDR</text>
<path d="M 395 277 L 435 277" stroke="#596b72" stroke-width="4"/><path d="M 435 277 l -12 -8 v 16 z" fill="#596b72"/>
<rect x="445" y="135" rx="12" width="345" height="285" fill="#edf3f8" stroke="#578ab5" stroke-width="2"/>
<text x="470" y="180" class="head">2. Independent qualification</text>
<text x="470" y="225" class="body">GSE36059 | 381 biopsies</text>
<text x="470" y="270" class="body">281 NR | 35 TCMR | 65 ABMR</text>
<text x="470" y="330" class="body">Estimands: replication and specificity</text>
<text x="470" y="375" class="sub">Model: moderated effect + 95% CI + BH FDR</text>
<path d="M 795 277 L 835 277" stroke="#596b72" stroke-width="4"/><path d="M 835 277 l -12 -8 v 16 z" fill="#596b72"/>
<rect x="845" y="135" rx="12" width="345" height="285" fill="#faf3e7" stroke="#b58335" stroke-width="2"/>
<text x="870" y="180" class="head">3. Randomized response</text>
<text x="870" y="225" class="body">GSE275824 | 22 patients</text>
<text x="870" y="270" class="body">63 biopsies | baseline, W24, W52</text>
<text x="870" y="330" class="body">Estimand: felzartamab-placebo DID</text>
<text x="870" y="375" class="sub">Model: moderated effect + 95% CI + BH FDR</text>
<rect x="45" y="465" rx="10" width="1145" height="90" fill="#f4f7f8" stroke="#bdcbd1"/>
<text x="625" y="500" text-anchor="middle" class="head">Advance only if all evidence gates pass</text>
<text x="625" y="532" text-anchor="middle" class="gate">DSA discrimination | external replication | ABMR-vs-TCMR specificity | randomized response | patient-level cell localization</text>
</svg>
